<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titre de la page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #222; }
    header, footer { background: #1f3a5f; color: #fff; padding: 1rem 2rem; }
    nav a { color: #fff; margin-right: 1rem; text-decoration: none; }
    main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    section { margin-bottom: 2rem; }
    h1, h2 { margin-bottom: 0.5rem; }
  </style>
</head>
<body>

  <header>
    <h1>Mon site</h1>
    <nav>
      <a href="#accueil">Accueil</a>
      <a href="#apropos">À propos</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="accueil">
      <h2>Accueil</h2>
      <p>Bienvenue sur ma page. Remplacez ce texte par votre contenu.</p>
    </section>

    <section id="apropos">
      <h2>À propos</h2>
      <p>Présentez ici votre activité ou votre projet.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Email : exemple@mail.com</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Mon site. Tous droits réservés.</p>
  </footer>

</body>
</html>
